    <style>
      body {
            margin: 0;
            font-family: sans-serif;
        }

        h1 {
            text-align: center;
            background: #2d6cdf;
            color: white;
            margin: 0;
            padding: 15px;
        }

        #searchBox {
            position: absolute;
            top: 60px;
            left: 0;
            width: 320px;
            height: calc(100vh - 60px);
            box-sizing: border-box;
            padding: 15px;
            background: #f5f5f5;
            overflow-y: auto;
            z-index: 1000;
        }

        #map {
            margin-left: 320px;
            height: calc(100vh - 60px);
        }

        #searchInput {
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            font-size: 16px;
            margin-bottom: 8px;
        }

        button {
            padding: 8px 15px;
            font-size: 16px;
            cursor: pointer;
            margin: 4px 0;
        }

        select {
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            font-size: 16px;
            margin-bottom: 8px;
        }

        input,
        textarea {
            max-width: 100%;
            box-sizing: border-box;
            padding: 8px;
            font-size: 16px;
            margin-bottom: 8px;
        }

        #placeList {
            display: none;
        }

        .placeItem {
            cursor: pointer;
            padding: 6px;
        }

        .placeItem:hover {
            background: #f0f0f0;
        }

        @media (max-width: 700px) {
            #searchBox {
                position: relative;
                top: auto;
                left: auto;
                width: 100%;
                height: auto;
            }

            #map {
                margin-left: 0;
                height: 70vh;
            }
        }
        .form-group {
            margin-bottom: 10px;
        }
        .form-group label {
            display: block;
            margin-bottom: 4px;
        }
        #addPlaceForm{
            display: none;
        }
        #openAddPlace{
            width:100%;
            padding:10px;
            margin:10px 0;
            font-size: 16px;
            font-weight: bold;
            cursor:pointer;
        }
        /* ===== 場所追加フォーム ===== */
        #addPlaceForm {
            background: #fff4e6;
            border: 2px solid #f3c892;
            border-radius: 10px;
            padding: 12px;
            margin-top: 10px;
        }

        /* 入力欄 */
        #addPlaceForm input,
        #addPlaceForm select,
        #addPlaceForm textarea {
            background: #fffdf7;
            border: 1px solid #d8b98a;
            border-radius: 6px;
        }

        /* 入力中の欄 */
        #addPlaceForm input:focus,
        #addPlaceForm select:focus,
        #addPlaceForm textarea:focus {
            background: #fff1c9;
            border: 2px solid #e0a83b;
            outline: none;
        }

        /* 「場所を追加」ボタン */
        #openAddPlace {
            background: #ffe0b2;
            border: 2px solid #e0a04b;
            border-radius: 8px;
        }

        /* 実際に追加するボタン */
        #addPlaceForm button {
            background: #ffd6a5;
            border: 2px solid #e09a3e;
            border-radius: 8px;
            font-weight: bold;
        }
        #clubActivityFilter.active{
            background: #ffd54f;
            border: 2px solid #e0a000;
            font-weight: bold;
        }
    /*=====ピンのポップアップ=====*/
    .leaflet-popup-content{

body {
    background-color: #f4efe3;

        #17283b

button {
    background-color: #31485c;
    color: #fff8e8;
    border: 1px solid #b99552;
    border-radius: 5px;
    transition: 0.2s;
}

/* ボタンにマウスを乗せたとき */
button:hover {
    background-color: #49647b;
}

/* 場所を追加するボタン */

    background-color: #8e352d;

    background-color: #a8473d;
}

    background-color: #f7efdd;

    border-radius: 8px;
    box-shadow: 0 3px 8px rgba(40, 30, 15, 0.12);
}

    background-color: #d8bd78;
    color: #302b25;
    border: 2px solid #8e352d;
}

/* 場所一覧 */
.placeItem {
    border-bottom: 1px solid #d2c3a5;
}

.placeItem:hover {
    background-color: #e4d8bf;
}

        /* ===== 工程②：操作ボタンのデザイン統一 ===== */

/* 操作パネル内のボタン */
#searchBox button {
min-height: 38px;
padding: 8px 12px;
font-weight: bold;
letter-spacing: 0.03em;

}

/* 検索ボタン */
#searchBox button[onclick="searchPlace()"] {
background-color: #31485c;
color: #fff8e8;
border: 1px solid #b99552;
}

/* 同好会活動フィルター */
#clubActivityFilter {
background-color: #e9dfca;
color: #31485c;
border: 2px solid #8d7955;
}

/* 同好会活動フィルター：選択中 */

background-color: #d8bd78;
color: #302b25;
border: 2px solid #8e352d;
}

/* すべて表示ボタン */

background-color: #eee5d2;
color: #31485c;
border: 1px solid #9c8b6b;
}

/* ボタンを押した瞬間 */
#searchBox button:active {
transform: translateY(1px);
box-shadow: none;
}

/* 入力欄とボタンの角を統一 */
#searchInput {
border-radius: 5px;
}

/* スマートフォンでは押しやすさを優先 */
@media (max-width: 700px) {
#searchBox button {
min-height: 42px;
}
}

/* ===== 工程②ここまで ===== */
/* ===== 工程③：歴史資料風ポップアップ ===== */

/* ポップアップ全体 */
.leaflet-popup-content-wrapper {
    background: #f7efdd;
    color: #302b25;
    border: 2px solid #b99552;
    border-radius: 8px;
    box-shadow: 0 5px 18px rgba(30, 25, 15, 0.25);
}

/* 吹き出しの先端 */
.leaflet-popup-tip {
    background: #f7efdd;
    border: 1px solid #b99552;
}

/* 場所の名前 */
.leaflet-popup-content h2 {
    background: #263b50;
    color: #f5e7c1;
    padding: 12px 10px;
    margin: 0 0 12px;
    border-bottom: 3px solid #b99552;
    border-radius: 5px 5px 0 0;
    font-family: "Yu Mincho", "Noto Serif JP", serif;
    font-size: 19px;
    line-height: 1.5;
}

/* 所在地・訪問年月など */
.leaflet-popup-content p {
    color: #302b25;
    line-height: 1.7;
    padding: 3px 2px;
    border-bottom: 1px solid #e0d3b9;
    overflow-wrap: anywhere;
}

/* コメント欄 */
.leaflet-popup-content div[id^="comments-"] {
    background: #fffaf0 !important;
    color: #302b25;
    border: 1px solid #d2bd91;
    border-left: 4px solid #8e352d;
    border-radius: 5px;
    padding: 10px !important;
    line-height: 1.7;
}

/* ポップアップ内の操作ボタン */
.leaflet-popup-content button {
    background: #31485c;
    color: #fff8e8;
    border: 1px solid #b99552;
    border-radius: 5px;
    padding: 8px 10px;
    margin-top: 7px;
    font-size: 14px;
    font-weight: bold;
}

/* ボタンにマウスを乗せたとき */
.leaflet-popup-content button:hover {
    background: #49647b;
}

/* 削除ボタンは注意を引く朱色に */
.leaflet-popup-content button[id^="delete-"] {
    background: #8e352d;
    border-color: #b99552;
}

/* スマートフォンでも横にはみ出さない */
@media (max-width: 700px) {
    .leaflet-popup-content {
        max-width: 260px !important;
        box-sizing: border-box;
    }

    .leaflet-popup-content h2 {
        font-size: 17px;
    }
}

// ===== 地図をクリックして位置を選ぶ =====
function chooseLocationOnMap(currentLat, currentLng) {
    return new Promise((resolve) => {
        const changeLocation = confirm(
            "位置を地図上で修正しますか？\n\n" +
            "OK：地図上で新しい位置を選ぶ\n" +
            "キャンセル：現在の位置を維持する"
        );

        if (!changeLocation) {
            resolve({
                lat: currentLat,
                lng: currentLng
            });
            return;
        }

        alert(
            "地図上の正しい場所をクリックしてください。\n" +
            "選んだ位置を確認してから確定できます。"
        );

        const tempMarker = L.marker(
            [currentLat, currentLng],
            { draggable: true }
        ).addTo(map);

        tempMarker.bindTooltip("位置修正用").openTooltip();

        function cleanup() {
            map.off("click", onMapClick);
            tempMarker.remove();
        }

        function onMapClick(e) {
            tempMarker.setLatLng(e.latlng);

            const confirmPosition = confirm(
                "この位置でよいですか？\n\n" +
                "緯度：" + e.latlng.lat.toFixed(6) + "\n" +
                "経度：" + e.latlng.lng.toFixed(6) + "\n\n" +
                "OK：この位置を採用\n" +
                "キャンセル：別の位置を選び直す"
            );

            if (confirmPosition) {
                cleanup();

                resolve({
                    lat: e.latlng.lat,
                    lng: e.latlng.lng
                });
            }
        }

        map.on("click", onMapClick);
    });
}

//====訪問年月を表示用に整える====
function formatVisitMonth(date) {
    if (!date) return "未入力";

    const match = String(date).match(/^(\d{4})[\/-](\d{1,2})/);

    if (!match) {
        return String(date);
    }

    return `${match[1]}年${Number(match[2])}月`;
}
// ===== 場所を削除 =====
async function deletePlace(place) {

    if (!confirm(`「${place.name}」を削除しますか？`)) {
        return;
    }

    try {

        await window.firestoreDeleteDoc(
            window.firestoreDoc(
                window.db,
                "places",
                place.id
            )
        );

        // 地図から削除
        if (place.marker) {
            map.removeLayer(place.marker);
        }

        // places配列から削除
        const index = places.indexOf(place);
        if (index !== -1) {
            places.splice(index, 1);
        }

        // markers配列から削除
        const markerIndex = markers.indexOf(place.marker);
        if (markerIndex !== -1) {
            markers.splice(markerIndex, 1);
        }

        createPlaceList();

        alert("場所を削除しました。");

    } catch (error) {

        console.error("削除エラー", error);

        alert("場所を削除できませんでした。");
    }  
}

// 場所を編集する
 async function editPlace(place) {
    const categories = ["城", "神社", "寺", "博物館", "遺跡", "町並み", "建物", "その他"];

    const newName = prompt("場所名", place.name);
    if (newName === null) return;

    const newCategory = prompt(
        "分類を入力してください\n" + categories.join(" / "),
        place.category
    );
    if (newCategory === null) return;
    if (!categories.includes(newCategory)) {
        alert("分類は一覧から選んでください。");
        return;
    }

    const newPrefecture = prompt("都道府県", place.prefecture);
    if (newPrefecture === null) return;

    const newCity = prompt("市区町村", place.city);
    if (newCity === null) return;

    const newAddress = prompt("住所・所在地", place.address);
    if (newAddress === null) return;
 // ===== 位置の修正方法を選ぶ =====
    const locationMethod = prompt(
        "位置の修正方法を選んでください\n\n" +
        "1：地図をクリックして修正\n" +
        "2：緯度・経度を数字で入力\n" +
        "3：現在の位置を維持",
        "1"
    );

    if (locationMethod === null) return;

    let newLat = Number(place.lat);
    let newLng = Number(place.lng);

    if (locationMethod === "1") {
        const selectedLocation = await chooseLocationOnMap(
            newLat,
            newLng
        );

        newLat = selectedLocation.lat;
        newLng = selectedLocation.lng;

    } else if (locationMethod === "2") {
        const newLatText = prompt(
            "緯度（数字）",
            String(place.lat)
        );
        if (newLatText === null) return;

        const newLngText = prompt(
            "経度（数字）",
            String(place.lng)
        );
        if (newLngText === null) return;

        newLat = Number(newLatText);
        newLng = Number(newLngText);

        if (
            newLatText.trim() === "" ||
            newLngText.trim() === "" ||
            !Number.isFinite(newLat) ||
            !Number.isFinite(newLng) ||
            newLat < -90 || newLat > 90 ||
            newLng < -180 || newLng > 180
        ) {
            alert("緯度・経度は正しい数字で入力してください。");
            return;
        }

    } else if (locationMethod !== "3") {
        alert("1、2、3のいずれかを入力してください。");
        return;
    }

    const newDate = prompt(
        "訪問年月（例：2026-10）",
        place.date
    );
    if (newDate === null) return;

    const newUser = prompt("投稿者", place.user || "ゲスト");
    if (newUser === null) return;

    const newPinType = prompt(
        "投稿区分（同好会 / ゲスト）",
        place.pinType || "ゲスト"
    );
    if (newPinType === null) return;
    if (!["同好会", "ゲスト"].includes(newPinType)) {
        alert("投稿区分は「同好会」か「ゲスト」にしてください。");
        return;
    }

    const newComment = prompt("コメント", place.comment || "");
    if (newComment === null) return;

    if (!newName.trim() || !newPrefecture.trim() || !newCity.trim()) {
        alert("場所名・都道府県・市区町村は必須です。");
        return;
    }

    const updatedData = {
        name: newName.trim(),
        category: newCategory,
        prefecture: newPrefecture.trim(),
        city: newCity.trim(),
        address: newAddress.trim(),
        lat: newLat,
        lng: newLng,
        date: newDate.trim(),
        user: newUser.trim() || "ゲスト",
        pinType: newPinType,
        comment: newComment.trim()
    };

    try {
        await window.authReady;

        if (!window.currentUser) {
            alert("ログインできていません。再読み込みしてください。");
            return;
        }

        await window.firestoreUpdateDoc(
            window.firestoreDoc(window.db, "places", place.id),
            updatedData
        );

        Object.assign(place, updatedData);

        if (place.marker) {
            place.marker.setLatLng([place.lat, place.lng]);

            if (markerIcons[place.category]) {
                place.marker.setIcon(markerIcons[place.category]);
            }

            place.marker.setPopupContent(`
                <h2>${icons[place.category] || "📍"} ${place.name}</h2>
                <p><b>分類</b>：${place.category}</p>
                <p><b>所在地</b>：${place.prefecture} ${place.city} ${place.address}</p>
                <p>📅 ${formatVisitMonth(place.date)}</p>
                <p>👥 ${place.pinType}</p>
                <p>👤 ${place.user}</p>
                <p>💭 ${place.comment}</p>
                <div id="comments-${place.id}"
                     style="
                     margin-top:10px;
                     padding:8px;
                     background:#fff8f0;
                     border-radius:6px;
                     max-height:180px;
                     overflow-y:auto;
                     overflow-wrap:anywhere;
                     padding-right:5px;">
                    コメントを読み込み中...
                </div>
                <button id="comment-${place.id}" style="width:100%;margin-top:6px;">
                    💭 コメントを追加
                </button>
                <button id="edit-${place.id}" style="margin-top:10px;">
                    ✏️ この場所を編集
                </button>
                <button id="delete-${place.id}" style="margin-top:10px;">
                    🚮 この場所を削除
                </button>
            `);
        }

        createPlaceList();
        alert("場所を更新しました！");

    } catch (error) {
        console.error("編集エラー", error);
        alert("場所を更新できませんでした。\n" + error.message);
    }
}


// ===== 検索機能 =====
function searchPlace(){
    const keyword =
        document.getElementById("searchInput").value.trim();

    if(keyword === ""){
        alert("検索する言葉を入力してください");
        return;
    }

    // 場所名・都道府県・市区町村・コメントから検索
    const results = places.filter(place =>
        place.name.includes(keyword) ||
        place.prefecture.includes(keyword) ||
        place.city.includes(keyword) ||
        place.comment.includes(keyword)
    );

    if(results.length === 0){
        alert("「" + keyword + "」に一致する場所が見つかりませんでした");
        return;
    }

    // 最初の検索結果へ移動
    const place = results[0];

    map.setView([place.lat, place.lng], 15);
    place.marker.openPopup();

    // 検索結果を場所一覧に表示
    const list = document.getElementById("placeList");

    list.innerHTML =
        "<b>🔎 「" + keyword + "」の検索結果：" +
        results.length + "件</b>";

    results.forEach(place => {

        list.innerHTML += `
        <div class="placeItem"
             onclick="moveToPlace('${place.name}')">
            ${icons[place.category]} ${place.name}
            <small>（${place.prefecture} ${place.city}）</small>
        </div>
        `;

    });
}

// ===== 場所一覧を作る =====
let clubActivityOnly = false;
function createPlaceList(category="全部"){

    const list = document.getElementById("placeList");

    list.innerHTML = "";

    const prefecture =
        document.getElementById("prefectureFilter").value;

    const pinType =
        document.getElementById("pinTypeFilter").value;

    const results = places.filter(place => {

        const prefectureOK =
            prefecture === "全部" ||
            place.prefecture === prefecture;

        const categoryOK =
            category === "全部" ||
            place.category === category;

        const pinTypeOK =
            pinType === "全部" ||
            place.pinType === pinType;
        const clubActivityOK =
            !clubActivityOnly ||
            (
                place.pinType === "同好会"&&
                place.user ==="歴史同好会"
            );

        return prefectureOK &&
               categoryOK &&
               pinTypeOK &&
               clubActivityOK;
    });

    // 件数を表示
    list.innerHTML =
        `<b>📍 場所一覧（${results.length}件）</b>`;

    // 場所を表示
    results.forEach(place => {

        list.innerHTML += `
        <div class="placeItem"
             onclick="moveToPlace('${place.name}')">

            ${icons[place.category]}
            <b>${place.name}</b>

            <small>
            （${place.prefecture} ${place.city}）
            </small>

        </div>
        `;
    });
}
function moveToPlace(name){
    const place = places.find(p=>p.name===name);
    if(place){
        map.setView([place.lat, place.lng],15);
        place.marker.openPopup();
    }
}
function filterCategory(){

    const category =
        document.getElementById("categoryFilter").value;

    const prefecture =
        document.getElementById("prefectureFilter").value;

    const pinType =
        document.getElementById("pinTypeFilter").value;

    markers.forEach(marker => {
        map.removeLayer(marker);
    });

    places.forEach(place => {

        const categoryOK =
            category === "全部" ||
            place.category === category;

        const prefectureOK =
            prefecture === "全部" ||
            place.prefecture === prefecture;

        const pinTypeOK =
            pinType === "全部" ||
            place.pinType === pinType;

        const clubActivityOK =
            !clubActivityOnly ||
            (
                place.pinType === "同好会" &&
                place.user === "歴史同好会"
            );
            

        if (
            categoryOK &&
            prefectureOK &&
            pinTypeOK &&
            clubActivityOK
        ) {
            place.marker.addTo(map);
        }

    });

    createPlaceList(category);
}

// ===== 住所から緯度・経度を自動取得 =====

    prefecture + city + name, 
    city + name
 　]; 
 　let found = false;
 try { 
    for (const query of searchQueries) {

             "https://nominatim.openstreetmap.org/search" +

              "&accept-language=ja" + 
              "&countrycodes=jp" +
               "&q=" +
                encodeURIComponent(query) 
            );

                lng,
                 "検索：" + query 
                ); found = true;

             "もう一度試してください。" ); 
             return;         
         }
   
 
    // ===== 新しい場所のデータを作成 =====

    const newPlace = {

        name: name,
        category: category,
        prefecture: prefecture,
        city: city,
        address: address,

        lng: lng,
        pinType: pinType,

     await window.authReady;

    newPlace.id = docRef.id;

        console.log("Firestore保存成功", newPlace);

        return;
    }


    // ===== 地図上に追加 =====

    places.push(newPlace);

    const marker = L.marker([newPlace.lat, newPlace.lng], {
        icon: markerIcons[newPlace.category]
    })

    markers.push(marker);

    createPlaceList();

    alert("場所を追加しました！");

    document.getElementById("newPlaceCity").value = "";

}

//コメントを追加する
 async function addComment(place){
    const userName = prompt(
        "名前を入力してください",
        "ゲスト"
    );
    if(userName === null) {
        return;
    }
    const commentText = prompt(
        "コメントを入力してください"
     );
     if(commentText === null || commentText.trim() ===""){
        return;
     }
     try{
        await window.authReady;
        if(!window.currentUser){
            alert("ログインできていません。再読み込みしてください。");
            return;
        }
        await window.firestoreAddDoc(
            window.firestoreCollection(
                window.db,
                "places",
                place.id,
                "comments"
            ),
            {
                user: userName.trim()||"ゲスト",
                text:commentText.trim(),
                ownerUid:window.currentUser.uid
            }
        );
        alert("コメントを追加しました");
     }catch (error){
        console.error("コメント追加エラー:",error);
        alert(
            "コメントの追加に失敗しました\n\n"+
           error.message
        );
    }
    await loadComments(place);
 }
// ===== コメントを読み込んで表示 =====
async function loadComments(place) {
    try {

        const snapshot = await window.firestoreGetDocs(
            window.firestoreCollection(
                window.db,
                "places",
                place.id,
                "comments"
            )
        );

        let commentsHTML = "";

        snapshot.forEach(doc => {

            const data = doc.data();

            commentsHTML += `
                <div style="
                    border-top:1px solid #ddd;
                    margin-top:8px;
                    padding-top:8px;
                ">
                    <div style="
                        display:flex;
                        justify-content:space-between;
                        align-items:center;
                    ">
                        <b>👤 ${data.user || "ゲスト"}</b>

                        <button
                            id="delete-comment-${doc.id}"
                            style="
                                font-size:12px;
                                padding:4px 8px;
                                margin:0;
                            "
                        >
                            🗑️ 削除
                        </button>
                    </div>

                    <p style="margin:4px 0;">
                        ${data.text || ""}
                    </p>
                </div>
            `;
        });

        if (commentsHTML === "") {
            commentsHTML = "<p>まだコメントはありません。</p>";
        }

        const commentArea = document.getElementById(
            `comments-${place.id}`
        );
        if (commentArea) {

           commentArea.innerHTML = commentsHTML;

           //コメント欄だけスクロールできるようにする

           commentArea.style.maxHeight = "180px";
           commentArea.style.overflowY = "auto";
           commentArea.style.paddingRight = "5px";

        }


       

        // ===== 削除ボタンを設定 =====
        snapshot.forEach(doc => {

            const deleteButton = document.getElementById(
                `delete-comment-${doc.id}`
            );

            if (deleteButton) {

                deleteButton.onclick = async function() {

                    const data = doc.data();

                    const result = confirm(
                        `「${data.text || ""}」\n\nこのコメントを削除しますか？`
                    );

                    if (!result) {
                        return;
                    }

                    try {

                        await window.firestoreDeleteDoc(
                            window.firestoreDoc(
                                window.db,

                                "places",
                                place.id,
                                "comments",
                                doc.id
                            )
                        );

                        alert("コメントを削除しました。");

                        await loadComments(place);

                    } catch (error) {

                        console.error(
                            "コメント削除エラー:",
                            error
                        );

                        alert(
                            "コメントの削除に失敗しました。\n\n" +
                            error.message
                        );
                    }
                };
            }
        });

    } catch (error) {

        console.error(
            "コメント読み込みエラー:",
            error
        );
    }
}
// いいね数をリアルタイムで読み込む
function loadLikes(place) {
    const placeKey = String(place.id || place.name);

    const countElement = document.getElementById(
        `like-count-${place.id}`
    );

    if (!countElement) return;

    const likesRef = window.firestoreCollection(
        window.db,
        "places",
        placeKey,
        "likes"
    );

    window.firestoreOnSnapshot(
        likesRef,
        (snapshot) => {
            countElement.textContent =
                `❤️ ${snapshot.size} いいね`;
        },
        (error) => {
            console.error("いいね読み込みエラー", error);
            countElement.textContent = "いいね数を読み込めません";
        }
    );
}

// いいねを追加・取り消しする
async function toggleLike(place) {
    try {
        const user = window.auth.currentUser;

        if (!user) {
            alert("ログインの準備ができていません。少し待ってから再度お試しください。");
            return;
        }

        const placeKey = String(place.id || place.name);

        const likeRef = window.firestoreDoc(
            window.db,
            "places",
            placeKey,
            "likes",
            user.uid
        );

        const likeSnapshot = await window.firestoreGetDoc(likeRef);

        if (likeSnapshot.exists()) {
            await window.firestoreDeleteDoc(likeRef);
        } else {
            await window.firestoreSetDoc(likeRef, {
                userId: user.uid,
                createdAt: new Date().toISOString()
            });
        }
    } catch (error) {
        console.error("いいね保存エラー", error);
        alert("いいねを保存できませんでした。Firebaseの設定を確認してください。");
    }
}
function togglePlaceList() {
    const placeList = document.getElementById("placeList");

    if (placeList.style.display === "none" || placeList.style.display === "") {
        placeList.style.display = "block";
    } else {
        placeList.style.display = "none";
    }
}
